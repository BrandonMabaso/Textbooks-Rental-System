<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Return Textbook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <h1>Return a Textbook</h1>
    <p>Process a textbook return</p>
</header>

<nav class="navbar">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="rent.html">Rent Textbook</a></li>
        <li><a href="return.html" class="active">Return Textbook</a></li>
    </ul>
</nav>

<main class="container">
    <section class="card">
        <h2>Return Form</h2>
        <p id="selectedCourseDisplay" style="margin-bottom:10px; font-weight:bold;"></p>
        <form id="returnForm">
            <input type="hidden" id="selectedCourseCode" name="courseCode">

            <label for="returnBook">Select Textbook</label>
            <select id="returnBook" required>
                <option value="">-- Choose a textbook --</option>
                <option>Introduction to Programming (CMPG111)</option>
                <option>Data Structures and Algorithms (CMPG221)</option>
                <option>Database Systems (CMPG311)</option>
                <option>Calculus I (MTHS111)</option>
            </select>

            <label for="student">Student Name</label>
            <input type="text" id="student" placeholder="Enter your name" required>

            <label for="studentNumber">Student Number</label>
            <input type="text" id="studentNumber" placeholder="Enter your student number" required inputmode="numeric" pattern="[0-9]*">
            <p id="studentNumberError" class="error-message" aria-live="polite"></p>

            <button type="submit">Return Textbook</button>
        </form>

        <div id="confirmation" class="confirmation-box" role="status" aria-live="polite" style="display:none;"></div>
    </section>

    <script>
    // Prefill selected course if present
    document.addEventListener('DOMContentLoaded', () => {
        const courseName = localStorage.getItem('selectedCourseName');
        const courseCode = localStorage.getItem('selectedCourseCode');
        if (courseName) {
            const display = document.getElementById('selectedCourseDisplay');
            display.textContent = `Selected course: ${courseName}`;
        }
        if (courseCode) {
            const hidden = document.getElementById('selectedCourseCode');
            hidden.value = courseCode;
        }
        // Try to preselect the return book if it matches the course name
        const returnSelect = document.getElementById('returnBook');
        for (let i = 0; i < returnSelect.options.length; i++) {
            if (returnSelect.options[i].text === courseName) {
                returnSelect.selectedIndex = i;
                break;
            }
        }
    });
    </script>
</main>

<footer class="footer">
    <p>&copy; 2026 Textbook Rental System</p>
</footer>

</body>
</html>
